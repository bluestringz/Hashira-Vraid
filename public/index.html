<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hashira VRaid</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d2e;--tx:#f3eef0;--mut:#a89aa0;--pan:rgba(16,7,11,.76);--pan2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--ov:rgba(6,2,5,.66);--solid:#1a0b10}
[data-theme=light]{--tx:#1d0f13;--mut:#6b5a60;--pan:rgba(255,255,255,.82);--pan2:rgba(0,0,0,.06);--bd:rgba(0,0,0,.15);--ov:rgba(255,255,255,.7);--solid:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,sans-serif;color:var(--tx);background:linear-gradient(var(--ov),var(--ov)),url(/bg.jpg) center/cover fixed,#120608}
h1,h2,h3,.brand{font-family:Rajdhani,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--red)}
button.p{background:var(--red);border-color:var(--red);color:#fff}
input,select{background:var(--pan2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
select option{color:#000}
input[type=checkbox]{width:auto}
input[type=color]{width:44px;height:36px;padding:2px}
:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.hide{display:none!important}
#login{height:100%;display:grid;place-items:center;padding:16px}
.card{background:var(--pan);border:1px solid var(--bd);backdrop-filter:blur(10px);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:10px;text-align:center}
.card img{width:170px;margin:0 auto}
.card h1{margin:0;font-size:34px;letter-spacing:.04em}
.card .row{display:flex;gap:8px}.card .row button{flex:1}
#err{color:var(--red);min-height:1.2em;font-size:13px}
#app{height:100%;display:grid;grid-template-columns:250px 1fr 230px}
aside,main{background:var(--pan);backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:0;min-width:0}
#side{border-right:1px solid var(--bd)}#mem{border-left:1px solid var(--bd)}
.hd{padding:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}
.hd img{width:38px}.brand{font-size:22px;font-weight:700;letter-spacing:.03em}
.list{flex:1;overflow:auto;padding:8px}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin:10px 4px 4px}
.ch{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.ch:hover,.ch.on{background:var(--pan2)}.ch.on{border-left:3px solid var(--red)}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vm{margin-left:22px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;padding:2px}
.av{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;position:relative;font-size:13px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vm .av{width:20px;height:20px;font-size:10px}.av.big{width:64px;height:64px;font-size:24px}
.av{transition:box-shadow .1s}.av.speaking{box-shadow:0 0 0 3px #3ba55d}.vm .av.speaking{box-shadow:0 0 0 2px #3ba55d}
.ico{position:relative;display:inline-block;margin-left:2px}
.ico.off::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--red);transform:rotate(-45deg);border-radius:1px}
.me{padding:10px;border-top:1px solid var(--bd);display:grid;gap:8px}
.me .r{display:flex;gap:6px;align-items:center}
.me .btns button{flex:1;padding:5px}
.me b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
#top h2{margin:0;font-size:22px;flex:1}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:10px}.m p{margin:2px 0 0;word-break:break-word}.m small{color:var(--mut)}
.m .del{opacity:0}.m:hover .del{opacity:1}@media(hover:none){.m .del{opacity:1}}
.acts{display:flex;gap:4px}
.sec[draggable=true],.ch[draggable=true]{cursor:grab}
.dt{box-shadow:inset 0 2px 0 var(--red)}.db{box-shadow:inset 0 -2px 0 var(--red)}
#send{display:flex;gap:8px;padding:12px}
#vbox{flex:1;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start}
.bar{width:100%;display:flex;gap:8px}
.vc{display:grid;justify-items:center;gap:4px;width:80px;text-align:center;font-size:13px}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px}
.mrow.mg{cursor:pointer}.mrow:hover{background:var(--pan2)}
.mrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.off{opacity:.5}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;color:#fff}
.x{padding:1px 7px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px;z-index:9}
#modal>div{background:var(--solid);border:1px solid var(--bd);border-radius:10px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:8px}
#modal h3{margin:0;font-size:22px}
.rr{display:grid;gap:6px;padding:10px;border:1px solid var(--bd);border-radius:8px}
.rr .top{display:flex;gap:8px}.cb{display:flex;gap:6px;align-items:center;font-size:14px}
#ctx{position:fixed;z-index:20;background:var(--solid);border:1px solid var(--bd);border-radius:8px;padding:4px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid}
#ctx button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
#ctx button:hover{background:var(--red);color:#fff}
#ctx .dng{color:#ff5a67}#ctx .dng:hover{color:#fff}
#ctx hr{border:0;border-top:1px solid var(--bd);margin:4px 0;width:100%}
#ctx .lbl{padding:4px 10px;color:var(--mut);font-size:12px}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:38vh 1fr}#mem{display:none}#side{border-right:0}}
</style></head><body>

<div id="login"><form class="card" onsubmit="event.preventDefault();auth('login')">
  <img src="/logo.png" alt="Hashira Esports">
  <h1>Hashira VRaid</h1>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div id="err"></div>
  <div class="row"><button class="p" type="submit">Login</button><button type="button" onclick="auth('register')">Create account</button></div>
</form></div>

<div id="app" class="hide">
  <aside id="side">
    <div class="hd"><img src="/logo.png" alt=""><span class="brand">Hashira VRaid</span></div>
    <div class="list" id="chl"></div>
    <div class="me" id="me"></div>
  </aside>
  <main>
    <div id="top"><h2 id="title"></h2><span id="topact"></span></div>
    <div id="msgs"></div>
    <form id="send"><input id="txt" placeholder="Type a message..." autocomplete="off" maxlength="500"><button class="p">Send</button></form>
    <div id="vbox" class="hide"></div>
  </main>
  <aside id="mem"><div class="hd"><b class="brand">Members</b></div><div class="list" id="mlist"></div></aside>
</div>
<div id="modal" class="hide"></div>
<div id="ctx" class="hide"></div>
<input type="file" id="file" accept="image/*" class="hide">

<script>
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let ws,S=null,cur=null,tok=localStorage.tk,local=null,muted=false,deaf=false,vc=null;
const pcs={},auds={};
document.documentElement.dataset.theme=localStorage.th||'dark';

async function auth(mode){
  const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,username:$('#u').value,password:$('#pw').value})});
  const j=await r.json();
  if(!r.ok)return $('#err').textContent=j.error;
  tok=localStorage.tk=j.token;$('#err').textContent='';connect();
}
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws?token='+tok);
  ws.onopen=()=>tx({t:'vs',m:muted,d:deaf});
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=e=>{
    leaveVoice(true);
    if(e.code>=4000){
      delete localStorage.tk;tok=null;S=null;
      $('#app').classList.add('hide');$('#login').classList.remove('hide');
      $('#err').textContent=e.code==4002?'You were kicked. You can log in again.':e.code==4003?'This account is banned.':'';
    }else setTimeout(connect,2000);
  };
}
const tx=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
if(tok)connect();
// keep-alive: stops idle proxies and Render's 15-minute idle timer from cutting the connection
setInterval(()=>{if(ws&&ws.readyState==1)tx({t:'ping'})},30000);

function on(m){
  if(m.t=='state'){
    const prev=vc&&S?new Set(S.voice[vc]||[]):null;S=m;
    if(prev){const now=S.voice[vc]||[];if(now.some(k=>k!=S.me.key&&!prev.has(k)))sJoin();else if([...prev].some(k=>k!=S.me.key&&!now.includes(k)))sLeave()}
    $('#login').classList.add('hide');$('#app').classList.remove('hide');
    const same=cur&&S.channels.find(c=>c.id==cur.id);
    if(same)cur=same;else pick(S.channels[0],true);
    render();syncPeers();
  }else if(m.t=='history'&&cur&&m.ch==cur.id){$('#msgs').replaceChildren();m.msgs.forEach(addMsg)}
  else if(m.t=='chat'&&cur&&m.ch==cur.id)addMsg(m.msg);
  else if(m.t=='peers')m.peers.forEach(k=>mk(k,true));
  else if(m.t=='sig')onSig(m.from,m.data);
  else if(m.t=='kicked'||m.t=='denied')leaveVoice(true);
  else if(m.t=='error')alert(m.msg);
  else if(m.t=='del'&&cur&&m.ch==cur.id){const e=document.querySelector('.m[data-id="'+CSS.escape(String(m.id))+'"]');e&&e.remove()}
  else if(m.t=='clear'&&cur&&m.ch==cur.id)$('#msgs').replaceChildren();
}

function avEl(k,name,cls){
  const a=E('div','av '+(cls||''),(name||'?')[0].toUpperCase());a.dataset.k=k;a.oncontextmenu=e=>{const u=S.users.find(x=>x.key==k);u&&userMenu(e,u)};
  const u=S&&S.users.find(x=>x.key==k);
  if(u&&u.av){const i=new Image();i.src='/av/'+k+'?v='+u.av;i.onerror=()=>i.remove();a.append(i)}
  return a;
}
function tag(id){const r=S.roles[id]||{name:id,color:'#777'};const t=E('span','tag',r.name);t.style.background=r.color;return t}
function addMsg(m){
  const d=E('div','m');d.append(avEl(m.key,m.name));
  const b=E('div'),h=E('div'),u=S.users.find(x=>x.key==m.key);
  const nb=E('b',0,(u?u.name:m.name)+' ');if(u)nb.oncontextmenu=e=>userMenu(e,u);h.append(nb);if(u)h.append(tag(u.role),E('small',0,' '+new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));
  const mid=m.id||m.ts;d.dataset.id=mid;
  if(S.me.role=='admin'){const x=E('button','x del','🗑');x.title='Delete message';x.onclick=()=>tx({t:'delmsg',ch:cur.id,id:mid});h.append(' ',x)}
  b.append(h,E('p',0,m.text));d.append(b);
  const box=$('#msgs');box.append(d);box.scrollTop=box.scrollHeight;
}
function pick(c,quiet){
  cur=c;if(!c)return;
  if(c.type=='text')tx({t:'open',ch:c.id});
  if(!quiet)render();
}

function render(){
  const me=S.me,P=p=>me.perms.includes(p),L=$('#chl');L.replaceChildren();
  if(P('channels')){const ac=E('button',0,'+ Add category');ac.style.width='100%';ac.onclick=()=>{const n=prompt('Category name');if(n)tx({t:'addcat',name:n})};L.append(ac)}
  [{id:'',name:'Channels'},...S.cats].forEach(cat=>{
    const chs=S.channels.filter(c=>(c.cat||'')==cat.id);
    if(cat.id&&!chs.length&&!P('channels'))return;
    const s=E('div','sec'),acts=E('span','acts');s.append(E('span',0,cat.name),acts);
    if(P('channels')){
      const b=E('button','x','+');b.title='Create channel here';b.onclick=()=>newCh(cat.id);acts.append(b);
      if(cat.id){
        const r=E('button','x','✎');r.title='Rename category';r.onclick=()=>{const n=prompt('New category name',cat.name);if(n)tx({t:'renamecat',id:cat.id,name:n})};
        const x=E('button','x','🗑');x.title='Delete category';x.onclick=()=>confirm('Delete category "'+cat.name+'"? Its channels move to Channels.')&&tx({t:'delcat',id:cat.id});
        acts.append(r,x);dg(s,{kind:'cat',id:cat.id});
      }
      dz(s,a=>{
        if(drag.kind=='ch')tx({t:'move',kind:'ch',id:drag.id,cat:cat.id,before:null});
        else if(cat.id&&drag.id!=cat.id){const i=S.cats.findIndex(y=>y.id==cat.id),nx=a?S.cats.slice(i+1).find(y=>y.id!=drag.id):cat;tx({t:'move',kind:'cat',id:drag.id,before:nx?nx.id:null})}
      });
    }
    L.append(s);
    chs.forEach(c=>{
      const d=E('div','ch'+(cur&&cur.id==c.id?' on':''));
      d.append(E('span',0,(c.type=='voice'?'🔊 ':'# ')+c.name+(c.open?'':' 🔒')));
      if(P('channels')){
        const b=E('button','x','✎');b.title='Rename';b.onclick=e=>{e.stopPropagation();const n=prompt('New channel name',c.name);if(n)tx({t:'renamech',id:c.id,name:n})};d.append(b);
        if(c.id!='open'){const x=E('button','x','🗑');x.title='Delete channel';x.onclick=e=>{e.stopPropagation();confirm('Delete "'+c.name+'"? Its messages will be lost.')&&tx({t:'delch',id:c.id})};d.append(x)}
        dg(d,{kind:'ch',id:c.id});
        dz(d,a=>{if(drag.kind!='ch'||drag.id==c.id)return;const i=chs.findIndex(y=>y.id==c.id),nx=a?chs.slice(i+1).find(y=>y.id!=drag.id):c;tx({t:'move',kind:'ch',id:drag.id,cat:cat.id,before:nx?nx.id:null})});
      }
      d.onclick=()=>pick(c);L.append(d);
      (S.voice[c.id]||[]).forEach(k=>{const u=S.users.find(x=>x.key==k);if(!u)return;const v=E('div','vm');v.oncontextmenu=e=>userMenu(e,u);v.append(avEl(k,u.name),E('span',0,u.name),...vsI(k));L.append(v)});
    });
  });
  // my footer
  const f=$('#me'),mu=S.users.find(x=>x.key==me.key);f.replaceChildren();
  const a=avEl(me.key,mu.name);a.style.cursor='pointer';a.title='Change profile picture';a.onclick=()=>$('#file').click();
  const nm=E('b',0,mu.name);nm.style.cursor='pointer';nm.title='Settings';nm.onclick=settings;
  const r1=E('div','r');r1.append(a,nm,tag(me.role));r1.oncontextmenu=e=>userMenu(e,mu);
  const r2=E('div','r btns'),eff=muted||deaf;
  const mic=E('button');mic.title=eff?'Unmute':'Mute';mic.append(ico('🎤',eff));
  mic.onclick=()=>{if(deaf){deaf=false;muted=false}else muted=!muted;setVS()};
  const hp=E('button');hp.title=deaf?'Undeafen':'Deafen';hp.append(ico('🎧',deaf));
  hp.onclick=()=>{deaf=!deaf;setVS()};
  const th=E('button',0,'◐');th.title='Dark / Light';th.onclick=()=>{const d=document.documentElement;d.dataset.theme=localStorage.th=d.dataset.theme=='dark'?'light':'dark'};
  const st=E('button',0,'⚙');st.title='Settings';st.onclick=settings;
  const lo=E('button',0,'⎋');lo.title='Log out';lo.onclick=()=>{delete localStorage.tk;location.reload()};
  r2.append(mic,hp,th,st,lo);f.append(r1,r2);
  // main
  const txt=cur&&cur.type=='text';
  $('#title').textContent=cur?(txt?'# ':'🔊 ')+cur.name:'';
  const ta=$('#topact');ta.replaceChildren();
  if(me.role=='admin'&&txt){const b=E('button',0,'Clear chat');b.onclick=()=>confirm('Delete ALL messages in # '+cur.name+'?')&&tx({t:'clear',ch:cur.id});ta.append(b)}
  $('#msgs').classList.toggle('hide',!txt);$('#send').classList.toggle('hide',!txt);$('#vbox').classList.toggle('hide',!!txt||!cur);
  if(cur&&!txt)panel();
  // members
  const M=$('#mlist');M.replaceChildren();
  S.users.slice().sort((a,b)=>b.on-a.on||a.name.localeCompare(b.name)).forEach(u=>{
    const mg=manageable(u),r=E('div','mrow'+(u.on?'':' off')+(mg?' mg':''));
    r.append(avEl(u.key,u.name),E('span',0,u.name+(u.banned?' (ban)':'')),tag(u.role));
    r.oncontextmenu=e=>userMenu(e,u);if(mg){r.title='Click or right-click to manage';r.onclick=()=>manage(u)}
    M.append(r);
  });
}
const STAFF=['channels','kick','assign'];
const staffRole=id=>((S.roles[id]||{perms:[]}).perms||[]).some(x=>STAFF.includes(x));
function tgtOk(u){return u.role!='admin'&&u.key!=S.me.key&&(S.me.role=='admin'||!staffRole(u.role))}
function kickOk(u){return tgtOk(u)&&!u.banned&&S.me.perms.includes('kick')}
function canAssign(u){return tgtOk(u)&&!u.banned&&(S.me.role=='admin'||S.me.perms.includes('assign'))}
function assignable(){return Object.entries(S.roles).filter(([i])=>i!='admin'&&(S.me.role=='admin'||!staffRole(i)))}
function manageable(u){return u.role!='admin'&&u.key!=S.me.key&&(u.banned?S.me.role=='admin':canAssign(u)||kickOk(u))}

function modal(t,...n){
  const m=$('#modal');m.replaceChildren();const d=E('div');d.append(E('h3',0,t),...n);
  const c=E('button',0,'Close');c.onclick=()=>m.classList.add('hide');d.append(c);m.append(d);m.classList.remove('hide');
}
$('#modal').onclick=e=>{if(e.target.id=='modal')e.target.classList.add('hide')};
const close=()=>$('#modal').classList.add('hide');

function newCh(cat){
  const n=E('input');n.placeholder='Channel name';n.maxLength=30;
  const t=E('select');[['text','Text channel'],['voice','Voice channel']].forEach(([v,l])=>{const o=E('option',0,l);o.value=v;t.append(o)});
  const lb=E('label','cb'),o=E('input');o.type='checkbox';lb.append(o,'Open to everyone (unchecked = private, Verified and above)');
  const b=E('button','p','Create channel');b.onclick=()=>{if(!n.value.trim())return;tx({t:'addch',name:n.value,type:t.value,open:o.checked,cat});close()};
  modal('New channel',n,t,lb,b);
}
function manage(u){
  const n=[];
  if(u.banned){if(S.me.role=='admin'){const b=E('button','p','Unban');b.onclick=()=>{tx({t:'unban',key:u.key});close()};n.push(b)}}
  else{
    if(canAssign(u)){
      const s=E('select');
      assignable().forEach(([i,r])=>{const o=E('option',0,r.name);o.value=i;s.append(o)});
      s.value=u.role;s.onchange=()=>tx({t:'setrole',key:u.key,role:s.value});
      n.push(E('label',0,'Role'),s);
    }
    if(kickOk(u)){
      const k=E('button',0,'Kick'),b=E('button','p','Ban');
      k.onclick=()=>{tx({t:'kick',key:u.key});close()};
      b.onclick=()=>{if(confirm('Ban '+u.name+'?')){tx({t:'ban',key:u.key});close()}};
      n.push(k,b);
    }
  }
  modal(u.name,...n);
}
const PL={channels:'Create, rename, delete and organize channels',kick:'Kick and ban users',assign:'Assign roles (not staff roles)',private:'See private voice and text channels'};
function roleRow(id,r){
  const d=E('div','rr'),top=E('div','top'),nm=E('input'),co=E('input');
  nm.value=r.name;nm.placeholder='Role name';co.type='color';co.value=r.color;top.append(nm,co);d.append(top);
  const ps=Object.entries(PL).map(([k,l])=>{const lb=E('label','cb'),c=E('input');c.type='checkbox';c.checked=r.perms.includes(k);lb.append(c,l);d.append(lb);return[k,c]});
  const sv=E('button','p',id?'Save':'Create role');
  sv.onclick=()=>{tx({t:'role',id,name:nm.value,color:co.value,perms:ps.filter(([,c])=>c.checked).map(([k])=>k)});close()};
  d.append(sv);
  if(id&&id!='default'){const x=E('button',0,'Delete role');x.onclick=()=>confirm('Delete this role? Members who have it go back to Default.')&&(tx({t:'delrole',id}),close());d.append(x)}
  return d;
}
function roleModal(){
  modal('Roles',...Object.entries(S.roles).filter(([i])=>i!='admin').map(([i,r])=>roleRow(i,r)),E('h3',0,'New role'),roleRow('',{name:'',color:'#888888',perms:[]}));
}

$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(i.width,i.height);
    c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);
    tx({t:'avatar',data:c.toDataURL('image/jpeg',.8)})};
  i.src=URL.createObjectURL(f);e.target.value='';
};
$('#send').onsubmit=e=>{e.preventDefault();const i=$('#txt');if(i.value.trim())tx({t:'chat',ch:cur.id,text:i.value});i.value=''};

/* ---------- Drag and drop (channels, categories) ---------- */
let drag=null;
function dg(el,o){el.draggable=true;el.ondragstart=e=>{drag=o;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');e.stopPropagation()};el.ondragend=()=>{drag=null}}
function dz(el,f){
  const low=e=>{const r=el.getBoundingClientRect();return e.clientY>=r.top+r.height/2};
  el.ondragover=e=>{if(!drag)return;e.preventDefault();const a=low(e);el.classList.toggle('dt',!a);el.classList.toggle('db',a)};
  el.ondragleave=()=>el.classList.remove('dt','db');
  el.ondrop=e=>{e.preventDefault();e.stopPropagation();const a=low(e);el.classList.remove('dt','db');if(drag)f(a);drag=null};
}

/* ---------- Settings, mute / deafen, speaking indicator ---------- */
const ico=(c,off)=>E('span','ico'+(off?' off':''),c);
const vsI=k=>{const s=(S.vs||{})[k]||{};return s.d?[ico('🎤',1),ico('🎧',1)]:s.m?[ico('🎤',1)]:[]};
function applyMic(){if(local)local.getAudioTracks().forEach(t=>t.enabled=!muted&&!deaf)}
function setVS(){applyMic();Object.values(auds).forEach(a=>a.muted=deaf);tx({t:'vs',m:muted,d:deaf});render()}
function settings(){
  const me=S.users.find(x=>x.key==S.me.key),n=E('input');n.value=me.name;n.maxLength=20;
  const sv=E('button','p','Save name');sv.onclick=()=>{tx({t:'setname',name:n.value});close()};
  const pic=E('button',0,'Change profile picture');pic.onclick=()=>{close();$('#file').click()};
  const items=[E('label',0,'Display name'),n,E('small',0,'Your login username stays "'+S.me.key+'".'),sv,pic];
  if(S.me.role=='admin'){const r=E('button',0,'Manage roles');r.onclick=roleModal;items.push(r)}
  modal('Settings',...items);
}
let actx;const an={};
function watch(k,stream){
  unwatch(k);
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();
    const src=actx.createMediaStreamSource(stream),a=actx.createAnalyser();a.fftSize=512;src.connect(a);
    an[k]={a,src,buf:new Uint8Array(a.fftSize),t:0}}catch{}
}
function unwatch(k){if(an[k]){try{an[k].src.disconnect()}catch{}delete an[k]}}
setInterval(()=>{
  const sp=new Set(),now=Date.now();
  for(const k in an){const o=an[k];o.a.getByteTimeDomainData(o.buf);let s=0;
    for(const v of o.buf){const d=(v-128)/128;s+=d*d}
    if(Math.sqrt(s/o.buf.length)>0.03)o.t=now;
    if(now-o.t<300)sp.add(k)}
  document.querySelectorAll('.vm .av[data-k],.vc .av[data-k]').forEach(e=>e.classList.toggle('speaking',sp.has(e.dataset.k)));
},100);

/* ---------- Right-click menu and join/leave sounds ---------- */
function ctx(e,items){
  e.preventDefault();e.stopPropagation();
  const m=$('#ctx');m.replaceChildren();
  items.forEach(i=>{
    if(i===null)m.append(E('hr'));
    else if(typeof i=='string')m.append(E('div','lbl',i));
    else{const b=E('button',i[2]||'',i[0]);b.onclick=()=>{hideCtx();i[1]()};m.append(b)}
  });
  m.classList.remove('hide');
  m.style.left=Math.max(4,Math.min(e.clientX,innerWidth-m.offsetWidth-6))+'px';
  m.style.top=Math.max(4,Math.min(e.clientY,innerHeight-m.offsetHeight-6))+'px';
}
const hideCtx=()=>$('#ctx').classList.add('hide');
document.addEventListener('click',hideCtx);
document.addEventListener('contextmenu',e=>{if(!e.defaultPrevented)hideCtx()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')hideCtx()});
addEventListener('resize',hideCtx);
function userMenu(e,u){
  const me=S.me,it=[u.name];
  if(u.key==me.key){
    it.push(['Change display name',()=>{const n=prompt('New display name',u.name);if(n)tx({t:'setname',name:n})}],
      ['Change profile picture',()=>$('#file').click()],null,
      [muted||deaf?'Unmute':'Mute',()=>{if(deaf){deaf=false;muted=false}else muted=!muted;setVS()}],
      [deaf?'Undeafen':'Deafen',()=>{deaf=!deaf;setVS()}]);
  }else if(u.banned){
    if(me.role=='admin'&&u.role!='admin')it.push(['Unban',()=>tx({t:'unban',key:u.key})]);
  }else{
    if(canAssign(u)){it.push(null,'Role');assignable().forEach(([id,r])=>it.push([(u.role==id?'✓ ':'')+r.name,()=>tx({t:'setrole',key:u.key,role:id})]))}
    if(kickOk(u))it.push(null,['Kick',()=>tx({t:'kick',key:u.key}),'dng'],['Ban',()=>confirm('Ban '+u.name+'?')&&tx({t:'ban',key:u.key}),'dng']);
  }
  if(it.length>1)ctx(e,it);
}
function beep(fs){
  if(deaf)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();const t=actx.currentTime;
    fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=t+i*.11;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.16);
      o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+.18)})}catch{}
}
const sJoin=()=>beep([523,784]),sLeave=()=>beep([659,440]);

/* ---------- Voice (WebRTC mesh, best for small groups) ---------- */
function panel(){
  const v=$('#vbox');v.replaceChildren();
  const inV=vc==cur.id,bar=E('div','bar');
  const j=E('button','p',inV?'Leave voice':'Join voice');j.onclick=()=>inV?leaveVoice():joinVoice(cur.id);bar.append(j);
  v.append(bar);
  (S.voice[cur.id]||[]).forEach(k=>{const u=S.users.find(x=>x.key==k);if(!u)return;const c=E('div','vc');c.oncontextmenu=e=>userMenu(e,u);c.append(avEl(k,u.name,'big'),E('div',0,u.name));const q=vsI(k);if(q.length){const ic=E('div');ic.append(...q);c.append(ic)}v.append(c)});
}
async function joinVoice(id){
  try{if(vc)leaveVoice();local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch{return alert('Microphone permission and HTTPS are required.')}
  vc=id;applyMic();watch(S.me.key,local);tx({t:'join',ch:id});tx({t:'vs',m:muted,d:deaf});sJoin();
}
function leaveVoice(quiet){
  Object.keys(pcs).forEach(closePeer);Object.keys(an).forEach(unwatch);
  if(local)local.getTracks().forEach(t=>t.stop());
  local=null;if(vc&&!quiet){tx({t:'leave'});sLeave()}
  vc=null;if(S&&cur)render();
}
function closePeer(k){unwatch(k);pcs[k]&&pcs[k].close();delete pcs[k];if(auds[k]){auds[k].srcObject=null;delete auds[k]}}
function syncPeers(){if(vc)Object.keys(pcs).forEach(k=>{if(!(S.voice[vc]||[]).includes(k))closePeer(k)})}
function mk(k,init){
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pcs[k]=pc;
  pc.onicecandidate=e=>e.candidate&&tx({t:'sig',to:k,data:{c:e.candidate}});
  pc.ontrack=e=>{const a=auds[k]||(auds[k]=new Audio());a.srcObject=e.streams[0];a.muted=deaf;a.play().catch(()=>{});watch(k,e.streams[0])};
  if(init)pc.onnegotiationneeded=async()=>{await pc.setLocalDescription(await pc.createOffer());tx({t:'sig',to:k,data:{d:pc.localDescription}})};
  local.getTracks().forEach(t=>pc.addTrack(t,local));
  return pc;
}
async function onSig(k,d){
  if(!local)return;
  const pc=pcs[k]||mk(k,false);
  if(d.d){
    await pc.setRemoteDescription(d.d);
    if(d.d.type=='offer'){await pc.setLocalDescription(await pc.createAnswer());tx({t:'sig',to:k,data:{d:pc.localDescription}})}
  }else if(d.c)try{await pc.addIceCandidate(d.c)}catch{}
}
