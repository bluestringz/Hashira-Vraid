<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hashira VRaid</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d2e;--tx:#f3eef0;--mut:#a89aa0;--pan:rgba(16,7,11,.76);--pan2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--ov:rgba(6,2,5,.66);--solid:#1a0b10}
[data-theme=light]{--tx:#1d0f13;--mut:#6b5a60;--pan:rgba(255,255,255,.82);--pan2:rgba(0,0,0,.06);--bd:rgba(0,0,0,.15);--ov:rgba(255,255,255,.7);--solid:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,sans-serif;color:var(--tx);background:linear-gradient(var(--ov),var(--ov)),url(/bg.jpg) center/cover fixed,#120608}
h1,h2,h3,.brand{font-family:Rajdhani,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--red)}
button.p{background:var(--red);border-color:var(--red);color:#fff}
input,select{background:var(--pan2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
select option{color:#000}
input[type=checkbox]{width:auto}
input[type=color]{width:44px;height:36px;padding:2px}
:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.hide{display:none!important}
#login{height:100%;height:100dvh;display:grid;place-items:center;padding:16px}
.card{background:var(--pan);border:1px solid var(--bd);backdrop-filter:blur(10px);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:10px;text-align:center}
.card img{width:170px;margin:0 auto}
.card h1{margin:0;font-size:34px;letter-spacing:.04em}
.card .row{display:flex;gap:8px}.card .row button{flex:1}
#err{color:var(--red);min-height:1.2em;font-size:13px}
#app{height:100%;height:100dvh;display:grid;grid-template-columns:250px minmax(0,1fr) 230px}
aside,main{background:var(--pan);backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:0;min-width:0}
#side{border-right:1px solid var(--bd)}#mem{border-left:1px solid var(--bd)}
.hd{padding:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}
.hd img{width:38px}.brand{font-size:22px;font-weight:700;letter-spacing:.03em}
.list{flex:1;overflow:auto;padding:8px}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin:10px 4px 4px}
.ch{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.ch:hover,.ch.on{background:var(--pan2)}.ch.on{border-left:3px solid var(--red)}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vm{margin-left:22px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;padding:2px}
.av{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;position:relative;font-size:13px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vm .av{width:20px;height:20px;font-size:10px}.av.big{width:64px;height:64px;font-size:24px}
.av{transition:box-shadow .1s}.av.speaking{box-shadow:0 0 0 3px #3ba55d}.vm .av.speaking{box-shadow:0 0 0 2px #3ba55d}
.ico{position:relative;display:inline-block;margin-left:2px}
.ico.off::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--red);transform:rotate(-45deg);border-radius:1px}
.me{padding:10px;border-top:1px solid var(--bd);display:grid;gap:8px}
.me .r{display:flex;gap:6px;align-items:center}
.me .btns button{flex:1;padding:5px}
.me b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
#top h2{margin:0;font-size:22px;flex:1}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:10px}.m p{margin:2px 0 0;word-break:break-word}.m small{color:var(--mut)}
.m .del{opacity:0}.m:hover .del{opacity:1}@media(hover:none){.m .del{opacity:1}}
.acts{display:flex;gap:4px}
.sec[draggable=true],.ch[draggable=true]{cursor:grab}
.dt{box-shadow:inset 0 2px 0 var(--red)}.db{box-shadow:inset 0 -2px 0 var(--red)}
#send{display:flex;gap:8px;padding:12px}
#vbox{flex:1;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;overflow:auto}
.bar{width:100%;display:flex;flex-wrap:wrap;gap:8px}
.vc{display:grid;justify-items:center;gap:4px;width:96px;text-align:center;font-size:13px}
.vc button{font-size:11px;padding:2px 6px}
.lonly{align-self:center;font-size:13px;color:var(--mut);padding:0 6px}
.lmrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vol{display:flex;align-items:center;gap:6px;font-size:12px;width:100%}.vol input{flex:1;min-width:0;accent-color:var(--red);border:0;padding:0;margin:0;background:none;box-shadow:none;outline:0;height:auto}
.m .tag+.tag{margin-left:3px}.vol span:last-child{min-width:34px;text-align:right;color:var(--mut)}
#ctx .vol{padding:2px 10px 6px}
.meter{height:10px;background:var(--pan2);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#3ba55d;transition:width .08s}
.cst{font-size:11px;color:var(--mut)}.cst.bad{color:#ff5a67}
.help{background:var(--pan2);border:1px solid var(--red);border-radius:8px;padding:10px;width:100%;display:grid;gap:6px}
#sndfix{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--red);color:#fff;padding:8px 14px;border-radius:8px;z-index:30;cursor:pointer;max-width:92vw;text-align:center}
.more{opacity:0;margin-left:auto}.ch:hover .more,.sec:hover .more{opacity:1}@media(hover:none){.more{opacity:1}}
.dropin{box-shadow:inset 0 0 0 2px var(--red);background:var(--pan2)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;width:100%}
.vgrid .vc{width:auto;padding:14px 8px;background:var(--pan2);border-radius:8px;align-content:center}
.vt{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;cursor:pointer;transition:box-shadow .1s}
.vt video{width:100%;height:100%;object-fit:cover;display:block}
.vt.scr video{object-fit:contain}.vt.mine.cam video{transform:scaleX(-1)}
.vt .vl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:5px;font-size:13px}
.vt.speaking{box-shadow:0 0 0 3px #3ba55d}
.vt.focus{grid-column:1/-1;aspect-ratio:auto;height:min(70vh,720px)}.vt.focus video{object-fit:contain}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px}
.mrow.mg{cursor:pointer}.mrow:hover{background:var(--pan2)}
.mrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.off{opacity:.5}
.grp{display:flex;align-items:center;gap:6px;padding:12px 6px 4px;color:var(--mut);font-size:13px;cursor:pointer;user-select:none}
.grp:first-child{padding-top:2px}
.grp i{width:8px;height:8px;border-radius:50%;flex:none}
.grp span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp small{font-size:12px}
.grp::after{content:'▾'}.grp.fold::after{content:'▸'}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;color:#fff}
.x{padding:1px 7px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px;z-index:25}
#modal>div{background:var(--solid);border:1px solid var(--bd);border-radius:10px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:8px}
#modal h3{margin:0;font-size:22px}
.rr{display:grid;gap:6px;padding:10px;border:1px solid var(--bd);border-radius:8px}
.rr .top{display:flex;gap:8px}.cb{display:flex;gap:6px;align-items:center;font-size:14px}
#ctx{position:fixed;z-index:20;background:var(--solid);border:1px solid var(--bd);border-radius:8px;padding:4px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid}
#ctx button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
#ctx button:hover{background:var(--red);color:#fff}
#ctx .dng{color:#ff5a67}#ctx .dng:hover{color:#fff}
#ctx hr{border:0;border-top:1px solid var(--bd);margin:4px 0;width:100%}
#ctx .lbl{padding:4px 10px;color:var(--mut);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--solid);border:1px solid var(--red);padding:8px 14px;border-radius:8px;z-index:30;max-width:90vw}
.mob,#scrim{display:none}
.ch,.mrow,.vm,.vc,.sec,.tag{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media(max-width:800px){
  html,body{overflow:hidden;overscroll-behavior:none}
  #app{display:block;position:relative;overflow:hidden}
  main{height:100%;width:100%}
  .mob{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:0;font-size:18px}
  #top{padding:calc(6px + env(safe-area-inset-top)) 10px 6px;gap:6px}
  #top h2{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #side,#mem{position:fixed;top:0;bottom:0;width:min(86vw,330px);z-index:15;padding-top:env(safe-area-inset-top);background:var(--solid);backdrop-filter:none;transition:transform .2s ease}
  #side{left:0;transform:translateX(-105%)}
  #mem{right:0;transform:translateX(105%)}
  #app.navopen #side,#app.memopen #mem{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14}
  #app.navopen #scrim,#app.memopen #scrim{display:block}
  .me{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #send{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  #msgs{padding:10px}
  #vbox{padding:10px;gap:10px}
  .vgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .vt.focus{height:45vh}
  button{min-height:38px}
  .x{padding:6px 10px;font-size:15px;min-height:34px;min-width:34px}
  .ch,.mrow{padding:10px 8px}
  input,select{font-size:16px}   /* iOS zooms the page when an input is smaller than 16px */
  #modal>div{max-height:88vh;max-height:88dvh}
  #toast{bottom:calc(24px + env(safe-area-inset-bottom))}
}
</style></head><body>

<div id="login"><form class="card" onsubmit="event.preventDefault();auth('login')">
  <img src="/logo.png" alt="Hashira Esports">
  <h1>Hashira VRaid</h1>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div id="err"></div>
  <div class="row"><button class="p" type="submit">Login</button><button type="button" onclick="auth('register')">Create account</button></div>
</form></div>

<div id="app" class="hide">
  <div id="scrim"></div>
  <aside id="side">
    <div class="hd"><img src="/logo.png" alt=""><span class="brand">Hashira VRaid</span></div>
    <div class="list" id="chl"></div>
    <div class="me" id="me"></div>
  </aside>
  <main>
    <div id="top"><button id="navBtn" class="mob" aria-label="Channels">☰</button><h2 id="title"></h2><span id="topact"></span><button id="memBtn" class="mob" aria-label="Members">👥</button></div>
    <div id="msgs"></div>
    <form id="send"><input id="txt" placeholder="Type a message..." autocomplete="off" maxlength="500"><button class="p">Send</button></form>
    <div id="vbox" class="hide"></div>
  </main>
  <aside id="mem"><div class="hd"><b class="brand">Members</b></div><div class="list" id="mlist"></div></aside>
</div>
<div id="modal" class="hide"></div>
<div id="ctx" class="hide"></div>
<div id="toast" class="hide"></div>
<div id="sndfix" class="hide">🔇 Your browser is blocking sound. Tap here to turn it on.</div>
<input type="file" id="file" accept="image/*" class="hide">

<script>
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let ws,S=null,cur=null,tok=localStorage.tk,local=null,muted=false,deaf=false,vc=null,noMic=false;   // noMic: in voice without a microphone (listening only)
const pcs={},auds={};
let desired=null,joining=false,joinedAt=0,misses=0,lost=false,rc=null,rt=null;   // desired: the voice channel I want to be in, so the app can get me back after a hiccup
try{desired=sessionStorage.vc||null}catch{}   // survives a page refresh (this tab only), so a refresh puts you back in voice
function want(id){desired=id||null;try{if(desired)sessionStorage.vc=desired;else delete sessionStorage.vc}catch{}}
document.documentElement.dataset.theme=localStorage.th||'dark';

async function auth(mode){
  const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,username:$('#u').value,password:$('#pw').value})});
  const j=await r.json();
  if(!r.ok)return $('#err').textContent=j.error;
  tok=localStorage.tk=j.token;$('#err').textContent='';connect();
}
function connect(){
  if(ws&&(ws.readyState===0||ws.readyState===1))return;   // never keep two sockets
  const sock=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws?token='+tok);
  ws=sock;
  sock.onopen=()=>{if(sock===ws)sendVS()};
  sock.onmessage=e=>{if(sock===ws)on(JSON.parse(e.data))};
  sock.onclose=e=>{
    if(sock!==ws)return;   // a late close from an old socket must not tear down the live one
    leaveVoice(true);
    if(e.code>=4000){
      want(null);
      if(e.code!=4004)delete localStorage.tk;   // 4004 = signed in elsewhere; keep the token so another tab of this browser keeps working
      tok=null;S=null;
      $('#app').classList.add('hide');$('#login').classList.remove('hide');
      $('#err').textContent=e.code==4002?'You were kicked. You can log in again.':e.code==4003?'This account is banned.':e.code==4004?'Your account was logged in from another device or browser tab, so this session was disconnected.':e.code==4005?'Your password was changed, so this device was signed out. Log in with the new password.':e.code==4006?'This account was deleted by the admin.':'Your session ended. Please log in again.';
    }else{
      if(!lost){lost=true;toast('Connection lost. Reconnecting…')}
      clearTimeout(rc);rc=setTimeout(connect,2000);   // when it is back, the app rejoins your voice channel by itself
    }
  };
}
const tx=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
if(tok)connect();
// keep-alive: stops idle proxies and Render's 15-minute idle timer from cutting the connection
setInterval(()=>{if(ws&&ws.readyState==1)tx({t:'ping'})},30000);

function on(m){
  if(m.t=='state'){
    const os=S?S.me.sv||{}:null;S=m;
    const ns=S.me.sv||{};if(os){if(!!ns.m!=!!os.m)toast(ns.m?'A moderator muted you':'You can speak again');if(!!ns.d!=!!os.d)toast(ns.d?'A moderator deafened you':'You can hear again')}
    applyMic();syncAudio();
    $('#login').classList.add('hide');$('#app').classList.remove('hide');
    const same=cur&&S.channels.find(c=>c.id==cur.id);
    if(same)cur=same;else pick((!cur&&desired&&S.channels.find(c=>c.id==desired))||S.channels[0],true);   // after a refresh, open the voice channel you were in
    render();syncPeers();
    if(managing&&!$('#modal').classList.contains('hide')){const u=S.users.find(x=>x.key==managing.k);if(u&&JSON.stringify([u.roles,u.banned])!=managing.sig)manage(u);else if(!u)close()}
    if(lost){lost=false;toast('Reconnected')}
    reconcile();
  }else if(m.t=='history'&&cur&&m.ch==cur.id){$('#msgs').replaceChildren();m.msgs.forEach(addMsg)}
  else if(m.t=='chat'&&cur&&m.ch==cur.id)addMsg(m.msg);
  else if(m.t=='peers')m.peers.forEach(k=>{if(pcs[k])closePeer(k);mk(k,true)});
  else if(m.t=='moved'){Object.keys(pcs).forEach(closePeer);vc=m.ch;want(m.ch);toast('A moderator moved you to another voice channel');const c=S&&S.channels.find(x=>x.id==m.ch);if(c)pick(c)}
  else if(m.t=='sig')onSig(m.from,m.data);
  else if(m.t=='vev'){m.ev=='join'?sJoin():sLeave()}
  else if(m.t=='kicked'||m.t=='denied'){want(null);leaveVoice(true);toast(m.by?'You were disconnected from voice by a moderator':'You no longer have access to that voice channel')}
  else if(m.t=='error')alert(m.msg);
  else if(m.t=='del'&&cur&&m.ch==cur.id){const e=document.querySelector('.m[data-id="'+CSS.escape(String(m.id))+'"]');e&&e.remove()}
  else if(m.t=='clear'&&cur&&m.ch==cur.id)$('#msgs').replaceChildren();
}

function avEl(k,name,cls){
  const a=E('div','av '+(cls||''),(name||'?')[0].toUpperCase());a.dataset.k=k;a.oncontextmenu=e=>{const u=S.users.find(x=>x.key==k);u&&userMenu(e,u)};
  const u=S&&S.users.find(x=>x.key==k);
  if(u&&u.av){const i=new Image();i.src='/av/'+k+'?v='+u.av;i.onerror=()=>i.remove();a.append(i)}
  return a;
}
function tag(id){const r=S.roles[id]||{name:id,color:'#777'};const t=E('span','tag',r.name);t.style.background=r.color;return t}
const rRank=id=>id=='admin'?1e3:id=='default'?-1:((S.roles[id]||{}).perms||[]).length;
const rName=id=>(S.roles[id]||{name:id}).name;
// every role a person has (highest first); Default only when they have no other role
function rolesOf(u){
  if(u.role=='admin')return['admin'];
  const r=(u.roles||[]).filter(id=>id!='default'&&S.roles[id]).sort((a,b)=>rRank(b)-rRank(a)||rName(a).localeCompare(rName(b)));
  return r.length?r:['default'];
}
function addMsg(m){
  const d=E('div','m');d.append(avEl(m.key,m.name));
  const b=E('div'),h=E('div'),u=S.users.find(x=>x.key==m.key);
  const nb=E('b',0,(u?u.name:m.name)+' ');if(u)nb.oncontextmenu=e=>userMenu(e,u);h.append(nb);if(u)h.append(...rolesOf(u).map(tag),E('small',0,' '+new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));
  const mid=m.id||m.ts;d.dataset.id=mid;
  if(S.me.role=='admin'){const x=E('button','x del','🗑');x.title='Delete message';x.onclick=()=>tx({t:'delmsg',ch:cur.id,id:mid});h.append(' ',x)}
  b.append(h,E('p',0,m.text));d.append(b);
  const box=$('#msgs');box.append(d);box.scrollTop=box.scrollHeight;
}
function pick(c,quiet){
  cur=c;if(!c)return;
  if(c.type=='text')tx({t:'open',ch:c.id});
  if(!quiet){closeDrawers();render()}
}

function render(){
  const me=S.me,P=p=>me.perms.includes(p),L=$('#chl');L.replaceChildren();
  // channel list: clean rows. Add / rename / delete are in the right-click menu (or the ⋯ that shows on hover).
  const addCat=()=>{const n=prompt('Category name');if(n)tx({t:'addcat',name:n})};
  const more=fn=>{const b=E('button','x more','⋯');b.title='More (or right-click)';b.onclick=e=>fn(e);return b};
  L.oncontextmenu=P('channels')?e=>ctx(e,['Channels',['Add channel',()=>newCh('')],['Add category',addCat]]):null;
  [{id:'',name:'Channels'},...S.cats].forEach(cat=>{
    const chs=S.channels.filter(c=>(c.cat||'')==cat.id);
    if(cat.id&&!chs.length&&!P('channels'))return;
    const s=E('div','sec');s.append(E('span',0,cat.name));
    if(P('channels')){
      const menu=e=>ctx(e,[cat.name,['Add channel here',()=>newCh(cat.id)],
        ...(cat.id?[['Rename category',()=>{const n=prompt('New category name',cat.name);if(n)tx({t:'renamecat',id:cat.id,name:n})}],
          ['Delete category',()=>confirm('Delete category "'+cat.name+'"? Its channels move to Channels.')&&tx({t:'delcat',id:cat.id}),'dng']]:[]),
        null,['Add category',addCat]]);
      s.oncontextmenu=menu;s.append(more(menu));
      if(cat.id)dg(s,{kind:'cat',id:cat.id});
      dz(s,a=>{
        if(drag.kind=='ch')tx({t:'move',kind:'ch',id:drag.id,cat:cat.id,before:null});
        else if(cat.id&&drag.id!=cat.id){const i=S.cats.findIndex(y=>y.id==cat.id),nx=a?S.cats.slice(i+1).find(y=>y.id!=drag.id):cat;tx({t:'move',kind:'cat',id:drag.id,before:nx?nx.id:null})}
      });
    }
    L.append(s);
    chs.forEach(c=>{
      const d=E('div','ch'+(cur&&cur.id==c.id?' on':''));
      d.append(E('span',0,(c.type=='voice'?'🔊 ':'# ')+c.name+(c.open?'':' 🔒')));
      if(c.roles&&c.roles.length)d.title='Only: '+c.roles.map(r=>(S.roles[r]||{name:r}).name).join(', ');
      if(P('channels')){

let _tone;
function toneUrl(){   // a short two-note chime as a WAV file, so the speaker test also works on the speaker you picked

  w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr,u=t<.3?t:t-.3,f=t<.3?587:880;b.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*Math.min(1,u/.02)*Math.exp(-u*7)*9000,true)}

async function netTest(out){

    pc.onicecandidate=e=>{if(e.candidate){const m=/ typ (\w+)/.exec(e.candidate.candidate);if(m)found[m[1]]=1}};
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(r=>{if(pc.iceGatheringState=='complete')return r();const t=setTimeout(r,5000);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState=='complete'){clearTimeout(t);r()}}});
  }catch(e){out.textContent='This browser could not run the test ('+((e&&e.name)||'error')+'). WebRTC may be turned off or blocked.';return}
  finally{try{pc&&pc.close()}catch{}}

/* ---------- Voice connections (WebRTC mesh, best for small groups) ---------- */
async function joinVoice(id){

    catch(e){   // no mic, mic blocked, or mic busy: still join, just listening
      st=new MediaStream();noMic=true;
      toast('No microphone available, so you joined listening only. Others cannot hear you.');
    }
    local=st;await loadIce();
    want(id);vc=id;joinedAt=Date.now();misses=0;
    applyMic();watch(S.me.key,local);tx({t:'join',ch:id});sendVS();sJoin();
    clearTimeout(rt);rt=setTimeout(reconcile,1600);
  }finally{joining=false;if(cur&&cur.type=='voice')panel()}
}
function reconcile(){   // keep this app and the server in agreement about who is in voice
  clearTimeout(rt);
  if(!desired||joining||!S)return;
  const inSrv=(S.voice[desired]||[]).includes(S.me.key);
  if(vc==desired&&inSrv){misses=0;return}
  const wait=1500-(Date.now()-joinedAt);
  if(vc==desired&&wait>0){rt=setTimeout(reconcile,wait+50);return}   // the join may still be on its way
  if(vc==desired){   // the server dropped me but I am still connected: ask to be put back
    if(++misses<=2){tx({t:'join',ch:desired});sendVS();rt=setTimeout(reconcile,1500);return}
    toast('You were removed from the voice channel');want(null);leaveVoice(true);return;
  }
  if(!vc)joinVoice(desired);   // the connection dropped and came back: rejoin
}

  ['cam','scr'].forEach(killVideo);

    catch{}finally{pc._m=false}

}
function onSig(k,d){

}
async function handleSig(pc,k,d){

}
